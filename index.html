<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЕГЭ Тренажер 1561</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --primary: var(--tg-theme-button-color, #38bdf8);
      --primary-text: var(--tg-theme-button-text-color, #0f172a);
      --success: #22c55e;
      --error: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }

    /* Header & Progress */
    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modes {
      display: flex;
      background: var(--card-bg);
      border-radius: 9999px;
      padding: 4px;
      border: 1px solid var(--border);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--primary);
      color: var(--primary-text);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 9999px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Main Card */
    .card-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 20px;
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: cardAppear 0.25s ease-out;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-tag {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
    }

    .card-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
    }

    .card-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Options Grid */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--border);
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      padding: 16px 20px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.15) !important;
      border-color: var(--success) !important;
      color: #4ade80 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--error) !important;
      color: #f87171 !important;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* Bottom Sheet / Result Feedback */
    .feedback-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1e293b;
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      transform: translateY(110%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .feedback-sheet.active {
      transform: translateY(0);
    }

    .feedback-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .feedback-header.success { color: var(--success); }
    .feedback-header.error { color: var(--error); }

    .feedback-rule {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 3px solid var(--primary);
    }

    .action-btn {
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Results Screen */
    .results-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 0;
      gap: 20px;
      flex: 1;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: conic-gradient(var(--success) calc(var(--percent, 0) * 1%), rgba(255, 255, 255, 0.1) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      position: relative;
    }

    .score-circle::after {
      content: "";
      position: absolute;
      width: 105px;
      height: 105px;
      background: var(--card-bg);
      border-radius: 50%;
    }

    .score-text {
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }

    .stats-summary {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border: 1px solid var(--border);
    }

    .stat-box {
      text-align: center;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header id="appHeader">
    <div class="top-bar">
      <div class="modes">
        <button class="mode-btn active" id="modeStress" onclick="switchMode('stress')">🎯 Ударения</button>
        <button class="mode-btn" id="modeParonym" onclick="switchMode('paronym')">📚 Паронимы</button>
        <button class="mode-btn" id="modeSoc" onclick="switchMode('soc')">🏛️ Обществознание</button>
      </div>
      <div class="streak-badge">
        🔥 <span id="streakCount">0</span>
      </div>
    </div>
    
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </header>

  <!-- Training Card -->
  <main class="card-container" id="mainContainer">
    <div class="question-card" id="questionCard">
      <span class="card-tag" id="cardTag">Задание 4 ЕГЭ (Орфоэпия)</span>
      <h2 class="card-title" id="cardTitle">бАнты</h2>
      <p class="card-subtitle" id="cardSubtitle">Выберите вариант с правильным ударением:</p>

      <div class="options-grid" id="optionsContainer">
        <!-- Buttons generated dynamically -->
      </div>
    </div>
  </main>

  <!-- Final Results Screen -->
  <div class="results-screen" id="resultsScreen">
    <h2 style="font-size: 26px;">🎉 Тренировка завершена!</h2>
    <p style="color: var(--text-muted); font-size: 15px;">Отличный шаг к уверенной сдаче ЕГЭ</p>
    
    <div class="score-circle" id="scoreCircle">
      <span class="score-text" id="scoreText">85%</span>
    </div>

    <div class="stats-summary">
      <div class="stat-box">
        <div class="stat-val" id="statCorrect">0 / 0</div>
        <div class="stat-label">Правильных ответов</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statMistakes">0</div>
        <div class="stat-label">Ошибок</div>
      </div>
    </div>

    <button class="action-btn" onclick="restartDeck()">Начать заново 🔄</button>
    <button class="action-btn" id="repeatMistakesBtn" style="background: rgba(255,255,255,0.08); color: #fff; box-shadow: none;" onclick="repeatMistakes()">Повторить ошибки ⚠️</button>
  </div>

  <!-- Bottom Feedback Sheet -->
  <div class="feedback-sheet" id="feedbackSheet">
    <div class="feedback-header" id="feedbackHeader">
      <span id="feedbackIcon">✅</span>
      <span id="feedbackTitle">Верно!</span>
    </div>
    <div class="feedback-rule" id="feedbackRule">Правило ФИПИ...</div>
    <button class="action-btn" id="nextBtn" onclick="nextQuestion()">Продолжить ➔</button>
  </div>

  <!-- Load Questions -->
  <script src="questions.js"></script>
  
  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let currentMode = "stress";
    let deck = [];
    let currentIndex = 0;
    let score = { correct: 0, total: 0 };
    let currentStreak = 0;
    let mistakes = [];

    // Fisher-Yates Shuffle without repetition
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initDeck() {
      let source;
      if (currentMode === "stress") {
        source = STRESS_DATA;
      } else if (currentMode === "paronym") {
        source = PARONYM_DATA;
      } else {
        source = SOC_DATA;
      }
      deck = shuffle(source);
      currentIndex = 0;
      score = { correct: 0, total: deck.length };
      mistakes = [];
      updateProgress();
      renderCurrentQuestion();
    }

    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      document.getElementById("modeStress").classList.toggle("active", mode === "stress");
      document.getElementById("modeParonym").classList.toggle("active", mode === "paronym");
      document.getElementById("modeSoc").classList.toggle("active", mode === "soc");
      
      document.getElementById("resultsScreen").style.display = "none";
      document.getElementById("mainContainer").style.display = "flex";
      document.getElementById("appHeader").style.display = "flex";
      initDeck();
    }

    function updateProgress() {
      const percent = deck.length > 0 ? (currentIndex / deck.length) * 100 : 0;
      document.getElementById("progressBar").style.width = `${percent}%`;
    }

    function renderCurrentQuestion() {
      if (currentIndex >= deck.length) {
        showResults();
        return;
      }

      const q = deck[currentIndex];
      const cardTag = document.getElementById("cardTag");
      const cardTitle = document.getElementById("cardTitle");
      const cardSubtitle = document.getElementById("cardSubtitle");
      const optionsContainer = document.getElementById("optionsContainer");

      optionsContainer.innerHTML = "";

      if (currentMode === "stress") {
        cardTag.innerText = "Задание 4 ЕГЭ (Орфоэпия)";
        cardTitle.innerText = q.word;
        cardSubtitle.innerText = "Выберите вариант с правильным ударением:";
      } else if (currentMode === "paronym") {
        cardTag.innerText = "Задание 5 ЕГЭ (Паронимы)";
        cardTitle.innerText = "Вставьте слово:";
        cardSubtitle.innerText = `«${q.sentence}»`;
      } else {
        cardTag.innerText = `ЕГЭ Обществознание • ${q.topic}`;
        cardTitle.innerText = "Тест:";
        cardSubtitle.innerText = q.question;
      }

      // Shuffle options for this question
      const opts = shuffle(q.options);
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(btn, opt, q);
        optionsContainer.appendChild(btn);
      });

      updateProgress();
    }

    function selectAnswer(btn, selected, question) {
      // Disable all option buttons
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(b => b.disabled = true);

      const isCorrect = (selected === question.correct);

      if (isCorrect) {
        btn.classList.add("correct");
        score.correct++;
        currentStreak++;
        tg?.HapticFeedback?.notificationOccurred("success");
        showFeedback(true, question.rule);
      } else {
        btn.classList.add("wrong");
        // Highlight correct
        buttons.forEach(b => {
          if (b.innerText === question.correct) b.classList.add("correct");
        });
        currentStreak = 0;
        mistakes.push(question);
        tg?.HapticFeedback?.notificationOccurred("error");
        showFeedback(false, question.rule);
      }

      document.getElementById("streakCount").innerText = currentStreak;
    }

    function showFeedback(isCorrect, rule) {
      const sheet = document.getElementById("feedbackSheet");
      const header = document.getElementById("feedbackHeader");
      const icon = document.getElementById("feedbackIcon");
      const title = document.getElementById("feedbackTitle");
      const ruleEl = document.getElementById("feedbackRule");

      header.className = `feedback-header ${isCorrect ? "success" : "error"}`;
      icon.innerText = isCorrect ? "✅" : "❌";
      title.innerText = isCorrect ? "В точку! Молодец!" : "Ошибка! Запомни:";
      ruleEl.innerText = rule;

      sheet.classList.add("active");
    }

    function nextQuestion() {
      document.getElementById("feedbackSheet").classList.remove("active");
      currentIndex++;
      renderCurrentQuestion();
    }

    function showResults() {
      document.getElementById("mainContainer").style.display = "none";
      document.getElementById("appHeader").style.display = "none";
      const resultsScreen = document.getElementById("resultsScreen");
      resultsScreen.style.display = "flex";

      const percent = Math.round((score.correct / score.total) * 100);
      document.getElementById("scoreText").innerText = `${percent}%`;
      document.getElementById("scoreCircle").style.setProperty("--percent", percent);

      document.getElementById("statCorrect").innerText = `${score.correct} / ${score.total}`;
      document.getElementById("statMistakes").innerText = mistakes.length;

      const repeatBtn = document.getElementById("repeatMistakesBtn");
      repeatBtn.style.display = mistakes.length > 0 ? "block" : "none";

      tg?.HapticFeedback?.notificationOccurred("success");
    }

    function restartDeck() {
      document.getElementById("resultsScreen").style.display = "none";
      document.getElementById("mainContainer").style.display = "flex";
      document.getElementById("appHeader").style.display = "flex";
      initDeck();
    }

    function repeatMistakes() {
      if (mistakes.length === 0) return;
      deck = shuffle(mistakes);
      mistakes = [];
      currentIndex = 0;
      score = { correct: 0, total: deck.length };

      document.getElementById("resultsScreen").style.display = "none";
      document.getElementById("mainContainer").style.display = "flex";
      document.getElementById("appHeader").style.display = "flex";
      updateProgress();
      renderCurrentQuestion();
    }

    // Start on load
    initDeck();
  </script>
</body>
</html>
